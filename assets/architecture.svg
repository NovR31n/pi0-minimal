<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
  <title id="title">pi0-minimal compact flow policy architecture</title>
  <desc id="desc">Two RGB views and language pass through frozen PaliGemma, robot state is projected separately, and a compact flow action expert predicts a ten by seven action chunk.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .title { font: 700 24px system-ui, sans-serif; fill: #172033; }
    .subtitle { font: 14px system-ui, sans-serif; fill: #64748b; }
    .box-title { font: 700 15px system-ui, sans-serif; fill: #172033; }
    .box-note { font: 12px system-ui, sans-serif; fill: #475569; }
    .small { font: 600 12px system-ui, sans-serif; fill: #64748b; }
    .line { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <rect width="1100" height="540" rx="18" fill="#f8fafc"/>
  <text x="48" y="45" class="title">Compact flow policy</text>
  <text x="48" y="70" class="subtitle">Frozen vision-language conditioning + approximately 44M trainable parameters</text>

  <g>
    <rect x="45" y="110" width="170" height="64" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="130" y="136" text-anchor="middle" class="box-title">Base RGB</text>
    <text x="130" y="157" text-anchor="middle" class="box-note">3 × 224 × 224</text>
    <rect x="45" y="195" width="170" height="64" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="130" y="221" text-anchor="middle" class="box-title">Wrist RGB</text>
    <text x="130" y="242" text-anchor="middle" class="box-note">3 × 224 × 224</text>
    <rect x="45" y="280" width="170" height="64" rx="12" fill="#f3e8ff" stroke="#c4b5fd"/>
    <text x="130" y="306" text-anchor="middle" class="box-title">Language</text>
    <text x="130" y="327" text-anchor="middle" class="box-note">instruction tokens</text>
    <rect x="45" y="407" width="170" height="64" rx="12" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="130" y="433" text-anchor="middle" class="box-title">Robot state</text>
    <text x="130" y="454" text-anchor="middle" class="box-note">7D proprioception</text>
  </g>

  <path d="M215 142 H270 V226 H305" class="line"/>
  <path d="M215 227 H305" class="line"/>
  <path d="M215 312 H270 V228 H305" class="line"/>
  <rect x="305" y="166" width="220" height="124" rx="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="415" y="211" text-anchor="middle" class="box-title">PaliGemma 3B</text>
  <text x="415" y="235" text-anchor="middle" class="box-note">vision-language prefix encoder</text>
  <rect x="360" y="251" width="110" height="24" rx="12" fill="#cbd5e1"/>
  <text x="415" y="268" text-anchor="middle" class="small">FROZEN</text>

  <path d="M525 228 H575" class="line"/>
  <rect x="575" y="188" width="170" height="80" rx="12" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="660" y="219" text-anchor="middle" class="box-title">Context projection</text>
  <text x="660" y="242" text-anchor="middle" class="box-note">cached 512D memory</text>

  <path d="M215 439 H575" class="line"/>
  <rect x="575" y="399" width="170" height="80" rx="12" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="660" y="430" text-anchor="middle" class="box-title">State projection</text>
  <text x="660" y="453" text-anchor="middle" class="box-note">one 512D token</text>

  <path d="M745 228 H790 V298 H820" class="line"/>
  <path d="M745 439 H790 V350 H820" class="line"/>
  <rect x="820" y="203" width="220" height="178" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="930" y="241" text-anchor="middle" class="box-title">Flow action expert</text>
  <text x="930" y="267" text-anchor="middle" class="box-note">8 layers · width 512</text>
  <text x="930" y="290" text-anchor="middle" class="box-note">bidirectional self-attention</text>
  <text x="930" y="313" text-anchor="middle" class="box-note">cross-attention to memory</text>
  <text x="930" y="345" text-anchor="middle" class="small">TRAINABLE · ~44M</text>

  <rect x="820" y="407" width="220" height="64" rx="12" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="930" y="433" text-anchor="middle" class="box-title">Noise + flow time</text>
  <text x="930" y="454" text-anchor="middle" class="box-note">10 action tokens</text>
  <path d="M930 407 V382" class="line"/>

  <path d="M1040 292 H1072" class="line"/>
  <text x="1073" y="278" text-anchor="end" class="small">10 × 7</text>
  <text x="1073" y="316" text-anchor="end" class="small">actions</text>
  <text x="550" y="516" text-anchor="middle" class="subtitle">Flow matching during training · 10 Euler integration steps during inference</text>
</svg>
